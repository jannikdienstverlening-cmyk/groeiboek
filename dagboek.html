<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Groeiboek — Dagboek</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f4faf7; display: flex; min-height: 100vh; }

    /* ── Sidebar ── */
    .sidebar { width: 240px; background: #1e6e55; color: white; display: flex; flex-direction: column; padding: 1.5rem 0; min-height: 100vh; position: fixed; }
    .sidebar-logo { padding: 0 1.5rem 1.5rem; font-size: 1.3rem; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.15); }
    .sidebar nav { flex: 1; padding: 1rem 0; }
    .sidebar nav a { display: block; padding: 0.75rem 1.5rem; color: rgba(255,255,255,0.85); text-decoration: none; font-size: 0.95rem; }
    .sidebar nav a:hover, .sidebar nav a.actief { background: rgba(255,255,255,0.15); color: white; }
    .sidebar-bottom { padding: 1rem 1.5rem; border-top: 1px solid rgba(255,255,255,0.15); }
    .btn-uitlog { width: 100%; padding: 0.6rem; background: rgba(255,255,255,0.15); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 0.9rem; }
    .btn-uitlog:hover { background: rgba(255,255,255,0.25); }

    /* ── Main ── */
    .main { margin-left: 240px; flex: 1; padding: 2rem; max-width: 860px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    .topbar h1 { font-size: 1.5rem; color: #1e6e55; }
    .kind-selector { display: flex; align-items: center; gap: 0.75rem; }
    select { padding: 0.5rem 1rem; border: 1px solid #ddd; border-radius: 8px; font-size: 0.9rem; outline: none; background: white; }

    /* ── Schrijfkaart ── */
    .schrijfkaart { background: white; border-radius: 16px; padding: 1.75rem; box-shadow: 0 2px 12px rgba(0,0,0,0.07); margin-bottom: 2rem; }

    /* Periode-selector */
    .periode-rij { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .periode-btn { padding: 0.45rem 1rem; border: 1.5px solid #ddd; border-radius: 20px; background: white; color: #555; font-size: 0.88rem; cursor: pointer; transition: all 0.15s; }
    .periode-btn:hover { border-color: #1e6e55; color: #1e6e55; }
    .periode-btn.actief { background: #1e6e55; color: white; border-color: #1e6e55; }

    /* Datumrij */
    .datum-rij { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
    input[type="date"] { padding: 0.55rem 0.9rem; border: 1px solid #ddd; border-radius: 8px; font-size: 0.9rem; outline: none; }
    input[type="date"]:focus { border-color: #1e6e55; }
    .leeftijd-badge { font-size: 0.82rem; color: #1e6e55; background: #e8f5f0; padding: 0.3rem 0.75rem; border-radius: 20px; }

    /* Prompt */
    .prompt-rij { display: flex; align-items: flex-start; gap: 0.5rem; margin-bottom: 0.75rem; }
    .prompt-tekst { font-size: 0.9rem; color: #888; font-style: italic; flex: 1; line-height: 1.5; }
    .btn-nieuwe-prompt { background: none; border: none; color: #aaa; font-size: 1rem; cursor: pointer; padding: 0; line-height: 1; flex-shrink: 0; margin-top: 2px; }
    .btn-nieuwe-prompt:hover { color: #1e6e55; }

    /* Tekstvak */
    textarea { width: 100%; padding: 0.85rem 1rem; border: 1.5px solid #ddd; border-radius: 10px; font-size: 1rem; font-family: inherit; line-height: 1.6; resize: vertical; min-height: 160px; outline: none; color: #222; }
    textarea:focus { border-color: #1e6e55; }

    /* Sfeer */
    .sfeer-rij { display: flex; gap: 0.5rem; margin-top: 1.1rem; flex-wrap: wrap; align-items: center; }
    .sfeer-label { font-size: 0.82rem; color: #aaa; margin-right: 0.25rem; }
    .sfeer-btn { padding: 0.4rem 0.9rem; border: 1.5px solid #ddd; border-radius: 20px; background: white; font-size: 0.85rem; cursor: pointer; color: #555; transition: all 0.15s; }
    .sfeer-btn:hover { border-color: #1e6e55; }
    .sfeer-btn.actief { background: #f0faf6; border-color: #1e6e55; color: #1e6e55; font-weight: 500; }

    /* Onderkant */
    .kaart-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 1.25rem; flex-wrap: wrap; gap: 0.75rem; }
    .btn-opslaan { padding: 0.65rem 1.75rem; background: #1e6e55; color: white; border: none; border-radius: 10px; font-size: 0.95rem; cursor: pointer; font-weight: 500; }
    .btn-opslaan:hover { background: #165c45; }
    .melding { font-size: 0.88rem; padding: 0.5rem 1rem; border-radius: 8px; display: none; }
    .melding.ok { background: #e8f5f0; color: #1e6e55; display: block; }
    .melding.fout { background: #fdecea; color: #c0392b; display: block; }

    /* ── Leegscherm ── */
    .leeg-scherm { background: white; border-radius: 16px; padding: 3rem 2rem; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,0.07); }
    .leeg-scherm .leeg-icoon { font-size: 3rem; margin-bottom: 1rem; }
    .leeg-scherm h2 { color: #1e6e55; font-size: 1.2rem; margin-bottom: 0.6rem; }
    .leeg-scherm p { color: #888; font-size: 0.92rem; line-height: 1.6; max-width: 380px; margin: 0 auto; }

    /* ── Tijdlijn ── */
    .tijdlijn-titel { font-size: 1rem; font-weight: 600; color: #1e6e55; margin-bottom: 1.25rem; }
    .tijdlijn { position: relative; padding-left: 1.5rem; }
    .tijdlijn::before { content: ''; position: absolute; left: 7px; top: 0; bottom: 0; width: 2px; background: #d4ede4; }
    .tl-item { position: relative; margin-bottom: 1.25rem; }
    .tl-dot { position: absolute; left: -1.5rem; top: 1rem; width: 14px; height: 14px; background: #1e6e55; border: 3px solid #f4faf7; border-radius: 50%; z-index: 1; }
    .tl-kaart { background: white; border-radius: 12px; padding: 1.1rem 1.25rem; box-shadow: 0 2px 8px rgba(0,0,0,0.06); cursor: pointer; transition: box-shadow 0.15s; border-left: 3px solid #1e6e55; }
    .tl-kaart:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
    .tl-kaart.open { border-left-color: #2d9c72; }
    .tl-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem; gap: 0.5rem; flex-wrap: wrap; }
    .tl-meta { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; }
    .tl-periode { font-size: 0.78rem; background: #e8f5f0; color: #1e6e55; padding: 0.2rem 0.6rem; border-radius: 10px; font-weight: 500; }
    .tl-leeftijd { font-size: 0.78rem; background: #f0f0f0; color: #666; padding: 0.2rem 0.6rem; border-radius: 10px; }
    .tl-sfeer { font-size: 0.78rem; background: #fffbe6; color: #7a6300; padding: 0.2rem 0.6rem; border-radius: 10px; }
    .tl-datum { font-size: 0.78rem; color: #bbb; white-space: nowrap; }
    .tl-preview { font-size: 0.9rem; color: #555; line-height: 1.55; }
    .tl-volledig { font-size: 0.9rem; color: #333; line-height: 1.7; }
    .tl-laden { text-align: center; padding: 2rem; color: #aaa; font-size: 0.9rem; }
  </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
  <div class="sidebar-logo">🌱 Groeiboek</div>
  <nav>
    <a href="dashboard.html">📊 Dashboard</a>
    <a href="dagboek.html" class="actief">📖 Dagboek</a>
    <a href="dashboard.html#groei">📏 Groeicurve</a>
    <a href="dashboard.html#mijlpalen">⭐ Mijlpalen</a>
    <a href="dashboard.html#woordjes">🗣️ Woordjes</a>
  </nav>
  <div class="sidebar-bottom">
    <button class="btn-uitlog" onclick="uitloggen()">↩ Uitloggen</button>
  </div>
</div>

<!-- Main -->
<div class="main">
  <div class="topbar">
    <h1>📖 Dagboek</h1>
    <div class="kind-selector">
      <select id="kind-select" onchange="kindWisselen()"></select>
    </div>
  </div>

  <!-- Schrijfkaart -->
  <div class="schrijfkaart">

    <!-- Periode -->
    <div class="periode-rij">
      <button class="periode-btn actief" data-periode="dag"      onclick="kiesPeriode(this)">☀️ Dag</button>
      <button class="periode-btn"        data-periode="week"     onclick="kiesPeriode(this)">📅 Week</button>
      <button class="periode-btn"        data-periode="maand"    onclick="kiesPeriode(this)">🌙 Maand</button>
      <button class="periode-btn"        data-periode="kwartaal" onclick="kiesPeriode(this)">🌱 Kwartaal</button>
    </div>

    <!-- Datum + leeftijd -->
    <div class="datum-rij">
      <input type="date" id="inp-datum" onchange="updateLeeftijdLabel()">
      <span class="leeftijd-badge" id="leeftijd-label"></span>
    </div>

    <!-- Schrijfprompt -->
    <div class="prompt-rij">
      <span class="prompt-tekst" id="schrijfprompt"></span>
      <button class="btn-nieuwe-prompt" onclick="nieuwePrompt()" title="Andere vraag">↻</button>
    </div>

    <!-- Tekstvak -->
    <textarea id="inp-inhoud" placeholder="Schrijf hier je dagboekbericht..."></textarea>

    <!-- Sfeer -->
    <div class="sfeer-rij">
      <span class="sfeer-label">Sfeer:</span>
      <button class="sfeer-btn" onclick="kiesSfeer('😊 Blij', this)">😊 Blij</button>
      <button class="sfeer-btn" onclick="kiesSfeer('✨ Bijzonder', this)">✨ Bijzonder</button>
      <button class="sfeer-btn" onclick="kiesSfeer('😓 Moeilijk', this)">😓 Moeilijk</button>
      <button class="sfeer-btn" onclick="kiesSfeer('☀️ Gewoon goed', this)">☀️ Gewoon goed</button>
    </div>

    <!-- Opslaan -->
    <div class="kaart-bottom">
      <div id="melding" class="melding"></div>
      <button class="btn-opslaan" onclick="opslaan()">Opslaan</button>
    </div>
  </div>

  <!-- Leegscherm -->
  <div id="leeg" class="leeg-scherm" style="display:none">
    <div class="leeg-icoon">📝</div>
    <h2>Nog geen herinneringen bewaard</h2>
    <p>Schrijf je eerste dagboekstukje hierboven. Elk klein momentje is het bewaren waard — ook de gewone dagen.</p>
  </div>

  <!-- Tijdlijn -->
  <div id="tijdlijn-sectie" style="display:none">
    <div class="tijdlijn-titel">Alle stukjes</div>
    <div class="tijdlijn" id="tijdlijn"></div>
  </div>
</div>

</body>
</html>
