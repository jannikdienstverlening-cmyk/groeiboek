<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Groeiboek — Dagboek</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ── Schrijfkaart ── */
    .schrijfkaart {
      background: var(--surface);
      border-radius: var(--radius-l);
      padding: 1.75rem;
      box-shadow: var(--schaduw);
      margin-bottom: 2rem;
      border: 1px solid var(--rand);
    }

    /* ── Periode-selector ── */
    .periode-rij { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }

    .periode-btn {
      padding: 0.45rem 1rem;
      border: 1.5px solid var(--rand);
      border-radius: 20px;
      background: var(--surface);
      color: var(--tekst-mid);
      font-size: 0.87rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: var(--overgang);
    }

    .periode-btn:hover { border-color: var(--groen); color: var(--groen); }

    .periode-btn.actief {
      background: var(--groen);
      color: white;
      border-color: var(--groen);
      box-shadow: 0 2px 8px rgba(40,137,108,0.25);
    }

    /* ── Datumrij ── */
    .datum-rij { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
    .datum-rij input[type="date"] { width: auto; }

    .leeftijd-badge {
      font-size: 0.8rem;
      color: var(--groen);
      background: var(--groen-licht);
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      font-weight: 700;
      border: 1px solid var(--groen-mid);
    }

    /* ── Prompt ── */
    .prompt-rij { display: flex; align-items: flex-start; gap: 0.5rem; margin-bottom: 0.85rem; }

    .prompt-tekst {
      font-size: 0.88rem;
      color: var(--tekst-licht);
      font-style: italic;
      flex: 1;
      line-height: 1.55;
      font-weight: 600;
    }

    .btn-nieuwe-prompt {
      background: none;
      border: none;
      color: var(--tekst-licht);
      font-size: 1rem;
      cursor: pointer;
      padding: 0;
      line-height: 1;
      flex-shrink: 0;
      margin-top: 2px;
      transition: var(--overgang);
    }

    .btn-nieuwe-prompt:hover { color: var(--groen); transform: rotate(45deg); }

    /* ── Tekstvak ── */
    textarea {
      min-height: 160px;
    }

    /* ── Sfeer ── */
    .sfeer-rij { display: flex; gap: 0.5rem; margin-top: 1.1rem; flex-wrap: wrap; align-items: center; }
    .sfeer-label { font-size: 0.78rem; color: var(--tekst-licht); margin-right: 0.25rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; }

    .sfeer-btn {
      padding: 0.4rem 0.9rem;
      border: 1.5px solid var(--rand);
      border-radius: 20px;
      background: var(--surface);
      font-size: 0.85rem;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
      color: var(--tekst-mid);
      transition: var(--overgang);
    }

    .sfeer-btn:hover { border-color: var(--groen); color: var(--groen); }

    .sfeer-btn.actief {
      background: var(--groen-licht);
      border-color: var(--groen);
      color: var(--groen);
    }

    /* ── Onderkant schrijfkaart ── */
    .kaart-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 1.25rem; flex-wrap: wrap; gap: 0.75rem; }

    .btn-opslaan {
      padding: 0.65rem 1.75rem;
      background: linear-gradient(135deg, var(--groen), var(--groen-donker));
      color: white;
      border: none;
      border-radius: var(--radius-s);
      font-size: 0.95rem;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: var(--overgang);
      box-shadow: 0 2px 10px rgba(40,137,108,0.28);
    }

    .btn-opslaan:hover { transform: translateY(-1px); box-shadow: 0 5px 18px rgba(40,137,108,0.36); }

    /* ── Leegscherm ── */
    .leeg-scherm {
      background: var(--surface);
      border-radius: var(--radius-l);
      padding: 3rem 2rem;
      text-align: center;
      box-shadow: var(--schaduw);
      border: 1px solid var(--rand);
    }

    .leeg-scherm .leeg-icoon { font-size: 3rem; margin-bottom: 1rem; }
    .leeg-scherm h2 { color: var(--tekst); font-size: 1.2rem; font-weight: 800; margin-bottom: 0.6rem; letter-spacing: -0.3px; }
    .leeg-scherm p { color: var(--tekst-licht); font-size: 0.92rem; line-height: 1.6; max-width: 380px; margin: 0 auto; font-weight: 600; }

    /* ── Tijdlijn ── */
    .tijdlijn-titel { font-size: 0.85rem; font-weight: 800; color: var(--tekst-mid); margin-bottom: 1.25rem; text-transform: uppercase; letter-spacing: 0.5px; }

    .tijdlijn { position: relative; padding-left: 1.5rem; }
    .tijdlijn::before { content: ''; position: absolute; left: 7px; top: 0; bottom: 0; width: 2px; background: var(--groen-mid); }

    .tl-item { position: relative; margin-bottom: 1.25rem; }

    .tl-dot {
      position: absolute;
      left: -1.5rem;
      top: 1rem;
      width: 14px;
      height: 14px;
      background: var(--groen);
      border: 3px solid var(--bg);
      border-radius: 50%;
      z-index: 1;
    }

    .tl-kaart {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 1.1rem 1.25rem;
      box-shadow: var(--schaduw);
      cursor: pointer;
      transition: var(--overgang);
      border: 1px solid var(--rand);
      border-left: 3px solid var(--groen);
    }

    .tl-kaart:hover { box-shadow: var(--schaduw-hover); }
    .tl-kaart.open { border-left-color: var(--groen-donker); }

    .tl-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem; gap: 0.5rem; flex-wrap: wrap; }
    .tl-meta { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; }

    .tl-periode { font-size: 0.75rem; background: var(--groen-licht); color: var(--groen-donker); padding: 0.2rem 0.6rem; border-radius: 10px; font-weight: 700; }
    .tl-leeftijd { font-size: 0.75rem; background: var(--bg); color: var(--tekst-mid); padding: 0.2rem 0.6rem; border-radius: 10px; font-weight: 600; }
    .tl-sfeer { font-size: 0.75rem; background: var(--goud-licht); color: #7A6300; padding: 0.2rem 0.6rem; border-radius: 10px; font-weight: 600; }
    .tl-datum { font-size: 0.75rem; color: var(--tekst-licht); white-space: nowrap; font-weight: 600; }

    .tl-preview { font-size: 0.9rem; color: var(--tekst-mid); line-height: 1.55; font-weight: 500; }
    .tl-volledig { font-size: 0.9rem; color: var(--tekst); line-height: 1.7; font-weight: 500; }
    .tl-laden { text-align: center; padding: 2rem; color: var(--tekst-licht); font-size: 0.9rem; font-weight: 600; }
  </style>
</head>

<!-- Main -->
<div class="main">
  <div class="topbar">
    <h1>📖 Dagboek</h1>
    <div class="kind-selector">
      <select id="kind-select" onchange="kindWisselen()"></select>
    </div>
  </div>

  <!-- Schrijfkaart -->
  <div class="schrijfkaart">

    <!-- Periode -->
    <div class="periode-rij">
      <button class="periode-btn actief" data-periode="dag"      onclick="kiesPeriode(this)">☀️ Dag</button>
      <button class="periode-btn"        data-periode="week"     onclick="kiesPeriode(this)">📅 Week</button>
      <button class="periode-btn"        data-periode="maand"    onclick="kiesPeriode(this)">🌙 Maand</button>
      <button class="periode-btn"        data-periode="kwartaal" onclick="kiesPeriode(this)">🌱 Kwartaal</button>
    </div>

    <!-- Datum + leeftijd -->
    <div class="datum-rij">
      <input type="date" id="inp-datum" onchange="updateLeeftijdLabel()">
      <span class="leeftijd-badge" id="leeftijd-label"></span>
    </div>

    <!-- Schrijfprompt -->
    <div class="prompt-rij">
      <span class="prompt-tekst" id="schrijfprompt"></span>
      <button class="btn-nieuwe-prompt" onclick="nieuwePrompt()" title="Andere vraag">↻</button>
    </div>

    <!-- Tekstvak -->
    <textarea id="inp-inhoud" placeholder="Schrijf hier je dagboekbericht..."></textarea>

    <!-- Sfeer -->
    <div class="sfeer-rij">
      <span class="sfeer-label">Sfeer:</span>
      <button class="sfeer-btn" onclick="kiesSfeer('😊 Blij', this)">😊 Blij</button>
      <button class="sfeer-btn" onclick="kiesSfeer('✨ Bijzonder', this)">✨ Bijzonder</button>
      <button class="sfeer-btn" onclick="kiesSfeer('😓 Moeilijk', this)">😓 Moeilijk</button>
      <button class="sfeer-btn" onclick="kiesSfeer('☀️ Gewoon goed', this)">☀️ Gewoon goed</button>
    </div>

    <!-- Opslaan -->
    <div class="kaart-bottom">
      <div id="melding" class="melding"></div>
      <button class="btn-opslaan" onclick="opslaan()">Opslaan</button>
    </div>
  </div>

  <!-- Leegscherm -->
  <div id="leeg" class="leeg-scherm" style="display:none">
    <div class="leeg-icoon">📝</div>
    <h2>Nog geen herinneringen bewaard</h2>
    <p>Schrijf je eerste dagboekstukje hierboven. Elk klein momentje is het bewaren waard — ook de gewone dagen.</p>
  </div>

  <!-- Tijdlijn -->
  <div id="tijdlijn-sectie" style="display:none">
    <div class="tijdlijn-titel">Alle stukjes</div>
    <div class="tijdlijn" id="tijdlijn"></div>
  </div>
</div>
